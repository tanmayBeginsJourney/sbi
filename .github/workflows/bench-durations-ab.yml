# BENCH ONLY - not for upstream.
#
# Q: does recording .test_durations under coverage change the per-test numbers,
#    and is the change NON-UNIFORM across tests? (findings/F025)
#
# v1 of this workflow ran the two arms as separate jobs and was worthless: GitHub's
# runner pool is heterogeneous, the control drew a Zen 3 EPYC 7763 and the treatment a
# Zen 4 EPYC 9V74, and the newer chip more than swallowed the effect being measured
# (naive ratio 0.80x against a predicted 1.1-1.2x). It also lost the durations file
# entirely - upload-artifact skips dotfiles unless include-hidden-files is set.
#
# v2 fixes both: every arm runs in ONE job on ONE machine, and the arms are sandwiched
# A-B-A so the repeated control measures this machine's own drift. A per-test cov/nocov
# ratio only counts as signal if it clears that noise floor.
#
# Population is a quarter of the suite with tutorials_test.py excluded. The exclusion
# matters: those 5 notebook tests are 43 min of the suite but only 5 data points, and
# they run the notebook in a subprocess where coverage of sbi/ barely applies - so they
# cost a third of the runtime and tell us almost nothing about per-test overhead.
# What is left is ~1800 dense, comparable tests and a ~105 min job.
name: Bench durations A/B

on:
  workflow_dispatch:
    inputs:
      rep:
        description: 'Replicate label (dispatch more than once for a second machine)'
        type: string
        default: '1'
      smoke:
        description: 'Smoke test: one tiny module, ~3 min, proves the plumbing works'
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  ab:
    name: durations A-B-A (rep ${{ inputs.rep }})
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'

    - name: Set up uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Install dependencies with uv
      run: uv sync --locked --extra dev

    - name: Rig provenance
      run: |
        {
          echo "rep=${{ inputs.rep }}"
          echo "run_id=${{ github.run_id }}"
          echo "started_utc=$(date -u +%FT%TZ)"
          echo "nproc=$(nproc)"
          echo "cpu=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs)"
          echo "commit=$(git rev-parse --short HEAD)"
          echo "torch=$(uv run python -c 'import torch;print(torch.__version__)')"
        } | tee provenance.txt

    # A1: control
    - name: A1 record without coverage
      run: |
        s=$(date +%s)
        # Flags inline, never via env: - `-m "not gpu"` in an env var gets
        # word-split by the shell into -m '"not' and pytest rejects the marker.
        # `|| true` keeps a FAILING TEST from truncating the recording (which is
        # upstream's own intent) but must not hide pytest never starting - the
        # verify step below is what catches that.
        if [ "${{ inputs.smoke }}" = "true" ]; then
          SEL=(tests/torchutils_test.py)
        else
          SEL=(--ignore=tests/tutorials_test.py --splitting-algorithm least_duration --splits 4 --group 1 tests/)
        fi
        uv run pytest -n auto -m "not gpu" --store-durations --durations-path dur_nocov1.json "${SEL[@]}" || true
        echo "a1_nocov_seconds=$(( $(date +%s) - s ))" | tee -a provenance.txt
    - name: B record WITH coverage
      run: |
        s=$(date +%s)
        # Flags inline, never via env: - `-m "not gpu"` in an env var gets
        # word-split by the shell into -m '"not' and pytest rejects the marker.
        # `|| true` keeps a FAILING TEST from truncating the recording (which is
        # upstream's own intent) but must not hide pytest never starting - the
        # verify step below is what catches that.
        if [ "${{ inputs.smoke }}" = "true" ]; then
          SEL=(tests/torchutils_test.py)
        else
          SEL=(--ignore=tests/tutorials_test.py --splitting-algorithm least_duration --splits 4 --group 1 tests/)
        fi
        uv run pytest -n auto -m "not gpu" --cov=sbi --cov-report=xml --store-durations --durations-path dur_cov.json "${SEL[@]}" || true
        echo "b_cov_seconds=$(( $(date +%s) - s ))" | tee -a provenance.txt
    - name: A2 record without coverage again
      run: |
        s=$(date +%s)
        # Flags inline, never via env: - `-m "not gpu"` in an env var gets
        # word-split by the shell into -m '"not' and pytest rejects the marker.
        # `|| true` keeps a FAILING TEST from truncating the recording (which is
        # upstream's own intent) but must not hide pytest never starting - the
        # verify step below is what catches that.
        if [ "${{ inputs.smoke }}" = "true" ]; then
          SEL=(tests/torchutils_test.py)
        else
          SEL=(--ignore=tests/tutorials_test.py --splitting-algorithm least_duration --splits 4 --group 1 tests/)
        fi
        uv run pytest -n auto -m "not gpu" --store-durations --durations-path dur_nocov2.json "${SEL[@]}" || true
        echo "a2_nocov_seconds=$(( $(date +%s) - s ))" | tee -a provenance.txt
    - name: Verify every arm actually ran
      # Three runs came back in 19 s / 22 s / 11 s with {} in every file and a green
      # check, because `|| true` turned a rejected marker expression into success.
      # Never again: assert each file holds a plausible number of tests.
      run: |
        min=$([ "${{ inputs.smoke }}" = "true" ] && echo 3 || echo 500)
        fail=0
        for f in dur_nocov1.json dur_cov.json dur_nocov2.json; do
          n=$(python -c "import json;print(len(json.load(open('$f'))))" 2>/dev/null || echo 0)
          echo "$f -> $n entries (need >= $min)"
          [ "$n" -lt "$min" ] && fail=1
        done
        [ "$fail" -eq 0 ] || { echo "::error::an arm recorded no durations"; exit 1; }

    - name: Upload all three duration files
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: durations-aba-rep${{ inputs.rep }}-${{ github.run_id }}
        include-hidden-files: true
        path: |
          dur_nocov1.json
          dur_cov.json
          dur_nocov2.json
          provenance.txt
        retention-days: 7
